<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="Styles/styles.css" rel="stylesheet">
    <title>Welcome to my Portfolio!</title>
</head>
<body class="site-page home-page">
    <a href="Menu.html" class="menumouse" aria-label="Open portfolio menu">
        <img src="Images/MenuChibi.png" alt="Open menu">
    </a>

    <main class="home-content">
        <img src="Images/character.webp" alt="Light highlighting an individual with a tray" class="stage">
        <img src="Images/opentray.webp" alt="The tray has been opened" class="opentray">

        <div class="clicktray">
            <input type="checkbox" id="toggle-circle">
            <label for="toggle-circle" class="clickable-circle" aria-label="Open portfolio tray"></label>

            <div class="locked">
                <div class="photo">
                    <img src="Images/me.webp" alt="Portrait illustration">
                    <div class="photohover">
                        <img src="Images/me.webp" alt="Larger portrait illustration">
                    </div>
                </div>
                <div class="hellotxt">
                    <p class="txt1">Helloo to all! My name is Brian Scott.</p>
                    <p class="txt2">I'm a Software Developer</p>
                </div>
                <div class="learn">
                    <a href="MoreAboutMe.html" class="moreaboutme">
                        Learn more about me
                        <img src="Images/mouse.jpg" alt="Mouse character">
                        <img src="Images/mouseshift.jpg" alt="Mouse character changing pose" class="memousepose">
                    </a>
                </div>
                <div class="project">
                    <a href="Projects.html" class="projects-link">
                        View my Projects
                        <img src="Images/mouse.jpg" alt="Mouse character">
                        <img src="Images/mouseshift.jpg" alt="Mouse character changing pose" class="promousepose">
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
    <div class="footer-mouse">
        <img src="Images/mouse.jpg" alt="Ms. SqueekSqeek">
    </div>

    <div class="footer-content">
        <p>Made with ♡ by Brian Scott, Truly!!!</p>

        <div class="footer-links">
            <a href="HomeIntro.html">Home</a>
            <a href="MoreAboutMe.html">About</a>
            <a href="Projects.html">Projects</a>
            <a href="Contact.html">Contact</a>
        </div>

        <p class="footer-copy">© 2026 Brian Scott • All Rights Reserved</p>
    </div>
</footer>
</body>
</html>
